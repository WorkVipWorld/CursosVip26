<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Streaming Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body {
  background: radial-gradient(circle at top, #1a1a2e, #0b0b15);
  color: white;
}

nav {
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  background:rgba(0,0,0,0.3);
}

nav h1 {color:#7f5af0;}

.hero {
  text-align:center;
  padding:120px 20px;
}

.hero h2 {
  font-size:3rem;
  background: linear-gradient(90deg,#7f5af0,#4cc9f0);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.btn {
  padding:15px 30px;
  background:linear-gradient(135deg,#7f5af0,#4cc9f0);
  border-radius:10px;
  text-decoration:none;
  color:white;
  display:inline-block;
  margin-top:20px;
}

.section {padding:60px 20px;text-align:center;}

.cards {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
}

.card {
  background:#1a1a2e;
  padding:20px;
  border-radius:12px;
  width:250px;
}
</style>
</head>

<body>

<nav>
<h1>Elite Streaming Hub</h1>
<a href="https://wa.me/13542225162">Soporte</a>
</nav>

<section class="hero">

<p>Todo en un solo lugar</p>

<!-- 🔥 BOTÓN AL PANEL -->
<a href="panel.html" class="btn">Acceder al contenido</a>

</section>

<section class="section">
<h2>Planes</h2>

<div class="cards">

<div class="card">
<h3>Básico</h3>
<p>$10</p>
</div>

<div class="card">
<h3>Pro</h3>
<p>$20</p>
</div>

<div class="card">
<h3>Full</h3>
<p>$35</p>
</div>

</div>
</section>

</body>
</html>
