<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Streaming Hub | Panel</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
  background: radial-gradient(circle at top, #1a1a2e, #0b0b15);
  color:white;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  background:rgba(0,0,0,0.3);
}

.user{color:#aaa;}

/* HEADER */
.header{
  padding:40px;
}

/* SECCIONES */
.section{
  padding:20px 40px;
}

.section h3{
  margin-bottom:15px;
  color:#4cc9f0;
}

/* FILAS */
.row{
  display:flex;
  gap:20px;
  overflow-x:auto;
  padding-bottom:10px;
}

/* CARD */
.card{
  min-width:220px;
  height:140px;
  border-radius:16px;
  padding:20px;
  display:flex;
  align-items:flex-end;
  font-weight:600;
  cursor:pointer;
  background:linear-gradient(135deg,#7f5af0,#4cc9f0);
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

/* LOADER */
.loader{
  position:fixed;
  width:100%;
  height:100%;
  background:#0b0b15;
  display:flex;
  justify-content:center;
  align-items:center;
}

button{
  background:#1a1a2e;
  border:none;
  color:white;
  padding:10px 20px;
  border-radius:10px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="loader" id="loader">Cargando...</div>

<nav>
  <div>
    <span id="userEmail"></span>
  </div>
  <button onclick="logout()">Salir</button>
</nav>

<div class="header">
  <h2>Bienvenido <span id="username"></span></h2>
  <p style="color:#aaa;">Accede a tu contenido premium</p>
</div>

<!-- 🎬 STREAMING -->
<div class="section">
  <h3>🎬 Curso Streaming</h3>
  <div class="row">
    <div class="card" onclick="goCurso('curso1.html')">Curso básico</div>
    <div class="card" onclick="goCurso('curso2.html')">Configuración</div>
  </div>
</div>

<!-- 🧠 AVANZADO -->
<div class="section">
  <h3>🧠 Curso Avanzado + Métodos</h3>
  <div class="row">
    <div class="card" onclick="goCurso('curso3.html')">Métodos PRO</div>
    <div class="card" onclick="goCurso('curso4.html')">Automatización</div>
  </div>
</div>

<!-- 💎 PREMIUM -->
<div class="section">
  <h3>💎 Contenido Premium</h3>
  <div class="row">
    <div class="card" onclick="goCurso('premium1.html')">Accesos VIP</div>
  </div>
</div>

<!-- 🛠 HERRAMIENTAS -->
<div class="section">
  <h3>🛠 Herramientas VIP</h3>
  <div class="row">
    <div class="card" onclick="goCurso('tools.html')">Herramientas</div>
  </div>
</div>

<!-- ⚙️ TOOLS -->
<div class="section">
  <h3>⚙️ Tools</h3>
  <div class="row">
    <div class="card" onclick="goCurso('tools2.html')">Scripts</div>
  </div>
</div>

<!-- 📦 OTROS -->
<div class="section">
  <h3>📦 Otros</h3>
  <div class="row">
    <div class="card" onclick="goCurso('otros.html')">Extras</div>
  </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyA9tSOC-cBhnBe3qNmMu0Yo2nTLpfzGjPU",
  authDomain: "cursovip-5adf5.firebaseapp.com",
  projectId: "cursovip-5adf5"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const loader = document.getElementById("loader");

auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById("userEmail").innerText = user.email;
    document.getElementById("username").innerText = user.email.split("@")[0];
    loader.style.display = "none";
  }else{
    window.location.href="login.html";
  }
});

function logout(){
  auth.signOut().then(()=>{
    window.location.href="login.html";
  });
}

function goCurso(url){
  window.location.href=url;
}

</script>

</body>
</html>
