<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Streaming Hub | Panel</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
  background: radial-gradient(circle at top, #1a1a2e, #0b0b15);
  color:white;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:220px;
  height:100vh;
  background:#0b0b15;
  border-right:1px solid rgba(255,255,255,0.05);
  padding:20px;
}

.sidebar h2{
  color:#7f5af0;
  margin-bottom:30px;
}

.menu a{
  display:block;
  padding:12px;
  color:#aaa;
  text-decoration:none;
  border-radius:10px;
  margin-bottom:10px;
  transition:0.3s;
}

.menu a:hover{
  background:#1a1a2e;
  color:white;
}

/* MAIN */
.main{
  flex:1;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  background:rgba(0,0,0,0.3);
}

.user{
  font-size:0.9rem;
  color:#aaa;
}

/* HEADER */
.header{
  padding:40px;
}

.header h2 span{
  color:#4cc9f0;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
  padding:40px;
}

/* CARD */
.card{
  height:150px;
  border-radius:16px;
  padding:20px;
  display:flex;
  align-items:flex-end;
  font-weight:600;
  cursor:pointer;
  background:linear-gradient(135deg,#7f5af0,#4cc9f0);
  transition:0.4s;
  position:relative;
  overflow:hidden;
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 30px rgba(127,90,240,0.6);
}

/* LABEL */
.card::after{
  content:"Entrar";
  position:absolute;
  top:10px;
  right:10px;
  font-size:0.8rem;
  opacity:0.7;
}

/* LOADER */
.loader{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#0b0b15;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:1.2rem;
}

/* STATUS */
.status{
  font-size:0.8rem;
  color:#4cc9f0;
}

/* LOGOUT */
.logout{
  background:#1a1a2e;
  border:none;
  color:white;
  padding:8px 15px;
  border-radius:10px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="loader" id="loader">Cargando panel...</div>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Elite Hub</h2>

  <div class="menu">
    <a href="#">Inicio</a>
    <a href="#">Cursos</a>
    <a href="#">Herramientas</a>
    <a href="#">Soporte</a>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- NAV -->
  <nav>
    <div>
      <span class="user" id="userEmail"></span>
      <span class="status">● Activo</span>
    </div>
    <button class="logout" onclick="logout()">Salir</button>
  </nav>

  <!-- HEADER -->
  <div class="header">
    <h2>Bienvenido <span id="username"></span></h2>
    <p style="color:#aaa;margin-top:10px;">
      Accede a tu contenido exclusivo
    </p>
  </div>

  <!-- CONTENIDO -->
  <div class="grid">

    <div class="card" onclick="goCurso('curso1.html')">
      Curso Streaming
    </div>

    <div class="card" onclick="alert('Próximamente')">
      Herramientas VIP
    </div>

    <div class="card" onclick="alert('Próximamente')">
      Automatización
    </div>

  </div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyA9tSOC-cBhnBe3qNmMu0Yo2nTLpfzGjPU",
  authDomain: "cursovip-5adf5.firebaseapp.com",
  projectId: "cursovip-5adf5"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const loader = document.getElementById("loader");

auth.onAuthStateChanged(user => {

  if (user) {

    document.getElementById("userEmail").innerText = user.email;
    document.getElementById("username").innerText = user.email.split("@")[0];

    loader.style.display = "none";

  } else {
    window.location.href = "login.html";
  }

});

function logout(){
  auth.signOut().then(()=>{
    window.location.href = "login.html";
  });
}

function goCurso(url){
  window.location.href = url;
}

</script>

</body>
</html>
