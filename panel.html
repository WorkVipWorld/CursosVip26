<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Streaming Hub | Panel</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
  background: radial-gradient(circle at top, #1a1a2e, #0b0b15);
  color:white;
}

/* NAV */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  backdrop-filter:blur(10px);
  background:rgba(0,0,0,0.3);
}

.logo{
  color:#7f5af0;
  font-weight:600;
}

.user{
  font-size:0.9rem;
  color:#aaa;
}

.logout{
  margin-left:15px;
  background:#1a1a2e;
  border:none;
  color:white;
  padding:8px 15px;
  border-radius:10px;
  cursor:pointer;
}

/* HEADER */
.header{
  text-align:center;
  padding:60px 20px 20px;
}

.header h2 span{
  color:#4cc9f0;
}

.header p{
  color:#aaa;
  margin-top:10px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
  padding:40px;
}

/* CARD */
.card{
  height:160px;
  border-radius:18px;
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
  background:linear-gradient(135deg,#7f5af0,#4cc9f0);
  transition:0.4s;
  position:relative;
  overflow:hidden;
}

/* EFECTO BRILLO */
.card::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:rgba(255,255,255,0.05);
  top:-50%;
  left:-50%;
  transform:rotate(25deg);
}

.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 30px rgba(127,90,240,0.5);
}

/* TEXTO CARD */
.card h3{
  font-size:1.2rem;
}

.card span{
  font-size:0.8rem;
  opacity:0.8;
}

/* LOADER */
.loader{
  position:fixed;
  width:100%;
  height:100%;
  background:#0b0b15;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:1.2rem;
}

/* BADGE */
.badge{
  position:absolute;
  top:10px;
  right:10px;
  font-size:0.7rem;
  background:rgba(0,0,0,0.3);
  padding:5px 10px;
  border-radius:20px;
}

</style>
</head>

<body>

<div class="loader" id="loader">Cargando panel...</div>

<nav>
  <div class="logo">Elite Hub</div>
  <div>
    <span class="user" id="userEmail"></span>
    <button class="logout" onclick="logout()">Salir</button>
  </div>
</nav>

<div class="header">
  <h2>Bienvenido <span id="username"></span></h2>
  <p>Accede a tu contenido exclusivo</p>
</div>

<div class="grid">

  <div class="card" onclick="goCurso('curso1.html')">
    <div class="badge">Curso</div>
    <h3>🎬 Streaming</h3>
    <span>Aprende desde cero</span>
  </div>

  <div class="card" onclick="goCurso('curso2.html')">
    <div class="badge">Avanzado</div>
    <h3>🧠 Métodos PRO</h3>
    <span>Estrategias avanzadas</span>
  </div>

  <div class="card" onclick="goCurso('premium1.html')">
    <div class="badge">Premium</div>
    <h3>💎 Contenido VIP</h3>
    <span>Accesos exclusivos</span>
  </div>

  <div class="card" onclick="goCurso('tools.html')">
    <div class="badge">Tools</div>
    <h3>🛠 Herramientas</h3>
    <span>Recursos útiles</span>
  </div>

  <div class="card" onclick="goCurso('otros.html')">
    <div class="badge">Extra</div>
    <h3>📦 Otros</h3>
    <span>Contenido adicional</span>
  </div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyA9tSOC-cBhnBe3qNmMu0Yo2nTLpfzGjPU",
  authDomain: "cursovip-5adf5.firebaseapp.com",
  projectId: "cursovip-5adf5"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const loader = document.getElementById("loader");

auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById("userEmail").innerText = user.email;
    document.getElementById("username").innerText = user.email.split("@")[0];
    loader.style.display = "none";
  }else{
    window.location.href="login.html";
  }
});

function logout(){
  auth.signOut().then(()=>{
    window.location.href="login.html";
  });
}

function goCurso(url){
  window.location.href=url;
}

</script>

</body>
</html>
