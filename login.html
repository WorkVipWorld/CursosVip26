<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>

<!-- Firebase (VERSIÓN CORRECTA PARA HTML) -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

<style>
body {
  background:#0f0f1a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:sans-serif;
}

.box {
  background:#1a1a2e;
  padding:30px;
  border-radius:10px;
}

input {
  display:block;
  margin:10px 0;
  padding:10px;
  width:100%;
}

button {
  padding:10px;
  background:#7f5af0;
  color:white;
  border:none;
  margin-top:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>Acceso</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Contraseña">

<button onclick="login()">Entrar</button>
<button onclick="register()">Registrarse</button>
</div>

<script>

window.addEventListener("load", () => {

  // 🔥 CONFIG NUEVA (LA TUYA CORRECTA)
  const firebaseConfig = {
    apiKey: "AIzaSyA9tSOC-cBhnBe3qNmMu0Yo2nTLpfzGjPU",
    authDomain: "cursovip-5adf5.firebaseapp.com",
    projectId: "cursovip-5adf5",
    storageBucket: "cursovip-5adf5.firebasestorage.app",
    messagingSenderId: "56026252587",
    appId: "1:56026252587:web:f341af48c15995802f316e"
  };

  // 🔥 INICIALIZAR FIREBASE
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const auth = firebase.auth();

  // REGISTRO
  window.register = () => {
    auth.createUserWithEmailAndPassword(
      document.getElementById("email").value,
      document.getElementById("password").value
    )
    .then(() => alert("Cuenta creada correctamente"))
    .catch(e => alert(e.message));
  };

  // LOGIN
  window.login = () => {
    auth.signInWithEmailAndPassword(
      document.getElementById("email").value,
      document.getElementById("password").value
    )
    .then(() => window.location.href = "panel.html")
    .catch(e => alert(e.message));
  };

});

</script>

</body>
</html>
